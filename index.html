<!DOCTYPE html>
<html lang="en" data-theme="auto" data-palette="meadow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Animal Not Crossing</title>
  <meta name="description" content="A quiet, ad-free logic puzzle. One animal per row, column and region, and none of them touching.">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Animals">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="subtitle"></div>
      <div id="status-right">
        <div id="timer" hidden>0:00</div>
        <div id="mistakes" aria-label="mistakes left"></div>
      </div>
    </header>

    <main id="board-wrap">
      <div id="board" role="grid" aria-label="puzzle board"></div>
      <div id="hint-slot">
        <div id="hint-banner" hidden></div>
        <div id="tip" hidden></div>
      </div>
      <div id="loading" hidden><span class="spinner"></span> Setting up a fresh puzzle</div>
    </main>

    <nav id="bar">
      <button id="btn-undo" class="bar-btn" type="button" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4l4-4M4 7l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 7h10a6 6 0 0 1 0 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Undo</span>
      </button>
      <button id="btn-hint" class="bar-btn" type="button" aria-label="Hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.1 1.2 1.8l.3 1.3h4l.3-1.3c.2-.7.6-1.3 1.2-1.8A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Hint</span>
      </button>
      <button id="btn-new" class="bar-btn" type="button" aria-label="New puzzle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>New</span>
      </button>
      <button id="btn-menu" class="bar-btn" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Menu</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="sheet-backdrop" hidden>
    <div id="end-card" class="card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <div id="overlay-art"></div>
      <h2 id="overlay-title"></h2>
      <p id="overlay-message"></p>
      <p id="overlay-time"></p>
      <p id="overlay-stat"></p>
      <button id="btn-next" class="primary" type="button">Next puzzle</button>
      <button id="btn-look" class="link" type="button">Look at the board</button>
    </div>
  </div>

  <div id="feedback" class="sheet-backdrop" hidden>
    <div id="feedback-card" class="card" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
      <div class="stars" aria-hidden="true">★★★★★</div>
      <h2 id="feedback-title"></h2>
      <p id="feedback-text"></p>
      <button id="btn-feedback-yes" class="primary" type="button"></button>
      <button id="btn-feedback-no" class="link" type="button"></button>
    </div>
  </div>

  <div id="menu" class="sheet-backdrop" hidden>
    <div id="menu-card" class="card sheet" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="sheet-handle"></div>
      <h2>Menu</h2>
      <section>
        <h3>Play</h3>
        <div class="row gap">
          <button id="btn-daily" type="button">Today's puzzle</button>
          <button id="btn-climb" type="button">Start a climb</button>
        </div>
        <p id="daily-streak" class="note"></p>
        <p id="climb-note" class="note"></p>
      </section>
      <section>
        <h3>Puzzle</h3>
        <label>Size <select id="set-size"></select></label>
        <label>Difficulty <select id="set-difficulty">
          <option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option><option value="random">Random</option>
        </select></label>
      </section>
      <section>
        <h3>Playing</h3>
        <label>Tapping <select id="set-tap">
          <option value="hold">X, hold for animal</option>
          <option value="cycle">cycles X then animal</option>
        </select></label>
        <label class="row"><input id="set-auto-mark" type="checkbox"> Auto-X cells an animal rules out</label>
        <label class="row"><input id="set-relaxed" type="checkbox"> Relaxed: no mistake limit</label>
        <label class="row"><input id="set-timer" type="checkbox"> Show timer</label>
      </section>
      <section>
        <h3>Look</h3>
        <label>Animal <select id="set-animal"></select></label>
        <label>Theme <select id="set-theme">
          <option value="auto">Match phone</option><option value="light">Light</option><option value="dark">Dark</option>
        </select></label>
        <label>Colors <select id="set-palette"></select></label>
        <label>Lines <select id="set-lines">
          <option value="fine">Fine</option><option value="normal">Normal</option><option value="bold">Bold</option><option value="heavy">Heavy</option>
        </select></label>
        <label class="row"><input id="set-advanced" type="checkbox"> Advanced mode</label>
      </section>
      <section id="stats-section">
        <h3>Stats</h3>
        <div id="stats"></div>
      </section>
      <section>
        <h3>Backup</h3>
        <div class="row gap">
          <button id="btn-export" type="button">Export</button>
          <button id="btn-import" type="button">Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </section>
      <button id="btn-menu-close" class="primary" type="button">Done</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
